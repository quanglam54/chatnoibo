<html lang="vi">
<head>

</head>

    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></symbol>

    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></symbol>

  <!-- ===== Màn hình cấu hình thiếu ===== -->
  <section id="setup-screen" class="center-screen hidden">
    <div class="card">
      <div class="brand"><svg><use href="#i-chat"/></svg><span>Chat Nội Bộ</span></div>
      <p>Chưa cấu hình Supabase. Mở <code>js/config.js</code> và điền <b>SUPABASE_URL</b>, <b>SUPABASE_ANON_KEY</b>.</p>
    </div>
  </section>

  <!-- ===== Đăng nhập / đăng ký ===== -->
  <section id="auth-screen" class="center-screen hidden">
    <form id="auth-form" class="card" autocomplete="on">
      <div class="brand"><svg><use href="#i-chat"/></svg><span class="app-name">Chat Nội Bộ</span></div>
      <div class="tabs">
        <button type="button" class="tab active" data-mode="login">Đăng nhập</button>
        <button type="button" class="tab" data-mode="signup">Đăng ký</button>
      </div>
      <label class="signup-only">Tên hiển thị<input name="display_name" maxlength="60" placeholder="VD: Nguyễn Văn A"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Mật khẩu<input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
      <label class="signup-only">Mã mời <small>(nếu quản trị có đặt)</small><input name="invite_code" autocomplete="off"></label>
      <button class="btn primary block" type="submit" id="auth-submit">Đăng nhập</button>
      <p class="form-error" id="auth-error"></p>
    </form>
  </section>

  <!-- ===== App ===== -->
  <div id="app" class="hidden">
    <aside id="sidebar">
      <header class="side-head">
        <button class="me-btn" id="me-btn" title="Hồ sơ của tôi"></button>
        <h1>Đoạn chat</h1>
        <button class="icon-btn" id="new-group-btn" title="Tạo nhóm"><svg><use href="#i-group"/></svg></button>
        <button class="icon-btn" id="new-chat-btn" title="Tin nhắn mới"><svg><use href="#i-edit"/></svg></button>
      </header>
      <div class="search-box">
        <svg><use href="#i-search"/></svg>
        <input id="conv-search" placeholder="Tìm kiếm người hoặc nhóm">
      </div>
      <div id="conv-list" class="conv-list"></div>
    </aside>

    <main id="chat">
      <div id="chat-empty" class="chat-empty">
        <svg><use href="#i-chat"/></svg>
        <p>Chọn một đoạn chat hoặc bắt đầu cuộc trò chuyện mới</p>
      </div>

      <div id="chat-pane" class="hidden">
        <header class="chat-head">
          <button class="icon-btn mobile-only" id="back-btn" title="Quay lại"><svg><use href="#i-back"/></svg></button>
          <div class="chat-title" id="chat-title-btn">
            <div id="chat-avatar"></div>
            <div>
              <div class="name" id="chat-name"></div>
              <div class="status" id="chat-status"></div>
            </div>
          </div>
          <button class="icon-btn accent" id="audio-call-btn" title="Gọi thoại"><svg><use href="#i-phone"/></svg></button>
          <button class="icon-btn accent" id="video-call-btn" title="Gọi video"><svg><use href="#i-video"/></svg></button>
          <button class="icon-btn accent" id="info-btn" title="Thông tin"><svg><use href="#i-info"/></svg></button>
        </header>
        <div id="call-banner" class="call-banner hidden">
          <span id="call-banner-text">Đang có cuộc gọi</span>
          <button class="btn small success" id="join-audio-btn"><svg><use href="#i-phone"/></svg>Tham gia</button>
          <button class="btn small success" id="join-video-btn"><svg><use href="#i-video"/></svg>Video</button>
        </div>
        <div id="messages" class="messages"></div>
        <div id="typing" class="typing hidden"><span class="dots"><i></i><i></i><i></i></span><span id="typing-text"></span></div>
        <div id="upload-progress" class="upload-progress hidden"></div>
        <form id="composer" class="composer">
          <button type="button" class="icon-btn accent" id="attach-btn" title="Gửi ảnh / file"><svg><use href="#i-attach"/></svg></button>
          <input type="file" id="file-input" multiple hidden>
          <textarea id="msg-input" rows="1" placeholder="Aa" maxlength="5000"></textarea>
          <button type="submit" class="icon-btn accent" id="send-btn" title="Gửi"><svg><use href="#i-send"/></svg></button>
        </form>
        <div id="drop-overlay" class="drop-overlay hidden">Thả file vào đây để gửi</div>
      </div>
    </main>
  </div>

  <!-- ===== Modal chung ===== -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <header>
        <h2 id="modal-title"></h2>
        <button class="icon-btn" id="modal-close"><svg><use href="#i-close"/></svg></button>
      </header>
      <div id="modal-body" class="modal-body"></div>
      <footer id="modal-foot"></footer>
    </div>
  </div>

  <!-- ===== Cuộc gọi đến ===== -->
  <div id="incoming" class="incoming hidden">
    <div class="incoming-card">
      <div id="incoming-avatar" class="pulse"></div>
      <div class="incoming-name" id="incoming-name"></div>
      <div class="incoming-sub" id="incoming-sub"></div>
      <div class="incoming-actions">
        <button class="round-btn danger" id="decline-btn" title="Từ chối"><svg><use href="#i-hangup"/></svg></button>
        <button class="round-btn success" id="accept-audio-btn" title="Nghe (thoại)"><svg><use href="#i-phone"/></svg></button>
        <button class="round-btn success" id="accept-video-btn" title="Nghe (video)"><svg><use href="#i-video"/></svg></button>
      </div>
    </div>
  </div>

  <!-- ===== Màn hình cuộc gọi ===== -->
  <div id="call" class="call hidden">
    <header class="call-head">
      <div>
        <div class="call-title" id="call-title"></div>
        <div class="call-sub" id="call-sub"></div>
      </div>
      <button class="icon-btn light" id="call-min-btn" title="Thu nhỏ"><svg><use href="#i-back"/></svg></button>
    </header>
    <div id="call-grid" class="call-grid"></div>
    <div class="call-controls">
      <button class="round-btn" id="mic-btn" title="Tắt/bật mic"><svg><use href="#i-mic"/></svg></button>
      <button class="round-btn" id="cam-btn" title="Tắt/bật camera"><svg><use href="#i-video"/></svg></button>
      <button class="round-btn" id="flip-btn" title="Đổi camera"><svg><use href="#i-flip"/></svg></button>
      <button class="round-btn" id="screen-btn" title="Chia sẻ màn hình"><svg><use href="#i-screen"/></svg></button>
      <button class="round-btn" id="add-people-btn" title="Mời thêm người (nhóm)"><svg><use href="#i-person-add"/></svg></button>
      <button class="round-btn danger" id="hangup-btn" title="Kết thúc"><svg><use href="#i-hangup"/></svg></button>
    </div>
  </div>
  <button id="call-pill" class="call-pill hidden"><svg><use href="#i-phone"/></svg><span id="call-pill-text">Đang gọi</span></button>

  <!-- ===== Xem ảnh ===== -->
  <div id="lightbox" class="lightbox hidden"><img alt=""><button class="icon-btn light" id="lightbox-close"><svg><use href="#i-close"/></svg></button></div>

  <div id="toasts" class="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/call.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
